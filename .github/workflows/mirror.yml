name: Mirror to Codeberg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'sleuthy-sloth'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Codeberg
        env:
          CB_TOKEN: ${{ secrets.CODERBERG_TOKEN }}
        run: |
          REPO="${{ github.event.repository.name }}"
          git fetch --unshallow 2>/dev/null || true
          # Use URL-embedded token for reliable auth
          git remote add codeberg "https://sleuthy-sloth:${CB_TOKEN}@codeberg.org/sleuthy-sloth/${REPO}.git"
          git push --force --all codeberg
          git push --force --tags codeberg
